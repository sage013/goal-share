<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Sharing Vault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Goal Sharing Vault</h1>
            <p>Securely share your lifetime goals with someone special!</p>
        </header>
        
        <section class="login-section">
            <h2>Login to your Vault</h2>
            <div class="input-group">
                <label for="secretCode">Enter your secret code:</label>
                <input type="text" id="secretCode" placeholder="Enter secret code" required>
                <button onclick="login()">Login</button>
            </div>
        </section>

        <section class="vault-section" style="display: none;">
            <h2>Your Vault</h2>
            <div class="goal-input">
                <textarea id="goalInput" placeholder="Add your lifetime goal..." rows="4"></textarea>
                <button onclick="saveGoal()">Save Goal</button>
            </div>
            <div class="goals-list" id="goalsList"></div>
        </section>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
